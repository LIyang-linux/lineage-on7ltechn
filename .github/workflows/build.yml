# 在 GitHub Actions 上编译 LineageOS 15.1 (Android 8.1) for Samsung Galaxy On7 国行 (on7ltechn)
#
# 使用方法：
#   1. 建一个 public 仓库（public 才有 4核/16GB 免费额度）
#   2. 把本文件放到 .github/workflows/build.yml
#   3. 仓库页 → Actions → 选 "Build LineageOS 15.1" → Run workflow
#   4. 跑完在本次 run 页面底部 Artifacts 下载 lineage-15.1-*-on7ltechn.zip
#
# 说明：
#   - 源码来自 LineageOS 官方 lineage-15.1 分支 + Galaxy-MSM8916 的设备树/vendor/内核
#   - 设备树用 on7ltechn（国行 SM-G6000），非国际版 o7prolte
#   - 只出 ROM zip，不含 GApps（刷完再单独刷 GApps）

name: Build LineageOS 15.1 (on7ltechn)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: false
        default: 'on7ltechn'
      jobs:
        description: 'Parallel jobs (-jx)'
        required: false
        default: '4'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 1. 清理磁盘并扩容
        uses: easimon/maximize-build-space@master
        with:
          # 合法的输入名是 build-mount-path（不是 build-root-directory）
          build-mount-path: /mnt/build
          build-mount-path-ownership: runner:runner
          # 根分区保留 10GB：够 apt 索引和基础工具
          root-reserve-mb: 10240
          temp-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=5 || sudo apt-get update -o Acquire::Retries=5
          # 逐个安装，缺哪个包就跳过，不让单个包拖垮整个步骤
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libstdc++6 libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-8-jdk python3 unzip libtinfo5"
          for p in $PKGS; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 || echo "skip: $p"
          done
          # Android 8.1 的构建脚本是 Python 2 语法，必须让 `python` 指向 python2
          for p in python2 python2.7 python2-minimal; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 && break
          done
          PY2="$(command -v python2.7 || command -v python2 || true)"
          if [ -z "$PY2" ]; then echo "FATAL: python2 not available"; exit 1; fi
          # /usr/local/bin 在 PATH 中优先于 /usr/bin，覆盖掉指向 python3 的那个 python
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$PY2" /usr/local/bin/python
          echo "python -> $(readlink -f /usr/local/bin/python)"; python --version
          java -version || echo "NO JDK8"
          df -h / /mnt/build

      - name: 3. 配置 git 和 repo
        run: |
          git config --global user.name  "GHA Builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 4. repo init (LineageOS 15.1, 浅克隆)
        working-directory: /mnt/build
        run: |
          repo init -u https://github.com/LineageOS/android.git -b lineage-15.1 --depth=1 --no-clone-bundle
          mkdir -p .repo/local_manifests
          curl -sL -o .repo/local_manifests/roomservice.xml \
            https://raw.githubusercontent.com/Galaxy-MSM8916/local_manifests/master/lineage-15.1.xml

      - name: 5. 修正 manifest（去掉失效的 vendor/gapps，补国行 on7ltechn）
        working-directory: /mnt/build
        run: |
          python3 - <<'PY'
          import io
          p = '.repo/local_manifests/roomservice.xml'
          # 1) 去掉指向 MindTheGapps/vendor_gapps 的失效项目（master 分支已不存在）
          lines = [l for l in io.open(p, encoding='utf-8').read().splitlines(True)
                   if 'MindTheGapps' not in l and 'path="vendor/gapps"' not in l]
          xml = ''.join(lines)
          # 2) 加入国行 on7ltechn 设备树
          entry = ('  <project path="device/samsung/on7ltechn" '
                   'name="Galaxy-MSM8916/android_device_samsung_on7ltechn" '
                   'groups="device" remote="Galaxy-MSM8916" '
                   'revision="lineage-15.1" />\n')
          if 'device/samsung/on7ltechn' not in xml:
              xml = xml.replace('</manifest>', entry + '</manifest>')
          io.open(p, 'w', encoding='utf-8').write(xml)
          print('--- manifest tail ---')
          print(''.join(xml.splitlines(True)[-6:]))
          PY

      - name: 6. repo sync
        working-directory: /mnt/build
        run: |
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          df -h /mnt

      - name: 6.5 修补 audio HAL（fork 混入了 Android 9 写法）
        working-directory: /mnt/build
        run: |
          python3 - <<'PY'
          import io
          p = 'hardware/qcom/audio-caf/msm8916/policy_hal/AudioPolicyManager.cpp'
          s = io.open(p, encoding='utf-8').read()
          if 'sp<AudioPolicyMix> policyMix = inputDesc->mPolicyMix.promote();' not in s:
              # mPolicyMix 在 8.1 是 wp<>，不能直接 ->；先 promote 成 sp<>
              s = s.replace(
                  'if (!inputDesc->isActive() || mInputRoutes.hasRouteChanged(session)) {',
                  'if (!inputDesc->isActive() || mInputRoutes.hasRouteChanged(session)) {\n'
                  '        sp<AudioPolicyMix> policyMix = inputDesc->mPolicyMix.promote();', 1)
              s = s.replace('inputDesc->mPolicyMix == NULL', 'policyMix == NULL')
              s = s.replace('inputDesc->mPolicyMix != NULL', 'policyMix != NULL')
              s = s.replace('inputDesc->mPolicyMix->', 'policyMix->')
              io.open(p, 'w', encoding='utf-8').write(s)
          print('patched:', s.count('policyMix->'), 'uses')
          PY
          grep -n "policyMix = inputDesc->mPolicyMix.promote" hardware/qcom/audio-caf/msm8916/policy_hal/AudioPolicyManager.cpp

      - name: 6.6 补国行内核 variant defconfig（15.1 分支遗漏）
        working-directory: /mnt/build
        run: |
          set -e
          DST=kernel/samsung/msm8916/arch/arm/configs/msm8916_sec_o7lte_chnopen_defconfig
          if [ ! -f "$DST" ]; then
            # 15.1 内核分支只有 swaopen，chnopen 只在 17.1 分支；
            # 但 15.1 的 arch/arm/mach-msm/Kconfig 已定义 MACH_O7_CHN_OPEN，可直接复用该配置
            curl -fsSL -o "$DST" \
              https://raw.githubusercontent.com/Galaxy-MSM8916/android_kernel_samsung_msm8916/lineage-17.1/arch/arm/configs/msm8916_sec_o7lte_chnopen_defconfig
          fi
          grep -n "MACH_O7_CHN_OPEN" "$DST"

      - name: 6.7 修宿主 GCC 的 -fno-common（3.10 内核 dtc 链接失败）
        working-directory: /mnt/build
        run: |
          set -e
          K=kernel/samsung/msm8916/Makefile
          # GCC>=10 默认 -fno-common，而 3.10 的 dtc 依赖同名全局变量合并（yylloc），
          # 给宿主工具链统一加 -fcommon 即可
          if ! grep -q '^HOSTCFLAGS.*-fcommon' "$K"; then
            sed -i 's/^HOSTCFLAGS *=/HOSTCFLAGS = -fcommon/' "$K"
          fi
          grep -n '^HOSTCFLAGS' "$K"

      - name: 6.8 关闭 Jack（4.11 在新 JDK8 上 SSL 握手失败）
        working-directory: /mnt/build
        run: |
          set -e
          B=device/samsung/on7ltechn/BoardConfig.mk
          if ! grep -q 'ANDROID_COMPILE_WITH_JACK' "$B"; then
            echo 'ANDROID_COMPILE_WITH_JACK := false' >> "$B"
          fi
          tail -n 3 "$B"

      - name: 6.9 修复 webview 预编译包的 LFS 指针
        working-directory: /mnt/build
        run: |
          set -e
          python3 - <<'PY'
          import json, os, re, urllib.request

          def post(url, payload):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="POST")
              req.add_header("Accept", "application/vnd.git-lfs+json")
              req.add_header("Content-Type", "application/vnd.git-lfs+json")
              return json.load(urllib.request.urlopen(req))

          # 设备只有 32 位，只需要 arm 这一份
          arch = "arm"
          d = f"external/chromium-webview/prebuilt/{arch}"
          p = os.path.join(d, "webview.apk")
          head = open(p, "rb").read(200) if os.path.exists(p) else b""
          if b"git-lfs.github.com/spec" not in head:
              print("not a lfs pointer, size=", os.path.getsize(p))
              raise SystemExit(0)
          txt = open(p, encoding="utf-8").read()
          oid = re.search(r"oid sha256:([0-9a-f]{64})", txt).group(1)
          size = int(re.search(r"size (\d+)", txt).group(1))
          # .lfsconfig 指向 LineageOS gerrit 的 LFS 服务
          url = ""
          cfg = os.path.join(d, ".lfsconfig")
          if os.path.exists(cfg):
              m = re.search(r'url\s*=\s*"?([^"\n]+)"?', open(cfg).read())
              if m:
                  url = m.group(1).strip()
          if not url:
              url = (f"https://review.lineageos.org/LineageOS/"
                     f"android_external_chromium-webview_prebuilt_{arch}.git/info/lfs")
          res = post(url.rstrip("/") + "/objects/batch",
                     {"operation": "download", "transfers": ["basic"],
                      "objects": [{"oid": oid, "size": size}]})
          href = res["objects"][0]["actions"]["download"]["href"]
          urllib.request.urlretrieve(href, p)
          print("fixed:", p, os.path.getsize(p))
          PY

      - name: 6.10 修正 system 分区大小（国行实测 1744MB）
        working-directory: /mnt/build
        run: |
          set -e
          # 实测：blockdev --getsize64 /dev/block/bootdevice/by-name/system = 1828716544
          # 设备树默认按国际版 2181038080(2.03GB) 生成镜像，国行写不进去
          for f in $(grep -rl "^BOARD_SYSTEMIMAGE_PARTITION_SIZE" device/samsung 2>/dev/null); do
            sed -i 's|^BOARD_SYSTEMIMAGE_PARTITION_SIZE.*|BOARD_SYSTEMIMAGE_PARTITION_SIZE := 1828716544|' "$f"
            echo "patched $f"; grep -n "BOARD_SYSTEMIMAGE_PARTITION_SIZE" "$f"
          done
          # 兼容不同 recovery 上报的设备名，避免 E3004
          B=device/samsung/on7ltechn/BoardConfig.mk
          if ! grep -q "^TARGET_OTA_ASSERT_DEVICE" "$B"; then
            echo 'TARGET_OTA_ASSERT_DEVICE := on7ltechn,o7prolte,o7lte,on7lte' >> "$B"
          fi
          grep -n "TARGET_OTA_ASSERT_DEVICE" "$B" || true

      - name: 7. 编译
        working-directory: /mnt/build
        env:
          JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
          JACK_SERVER_VM_ARGUMENTS: "-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4g"
          ANDROID_JACK_VM_ARGS: "-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4g"
          LC_ALL: C
          USE_CCACHE: "0"
        run: |
          set -o pipefail
          # Jack 走 PATH 里的 java 启动服务端，必须锁定 JDK 8，否则客户端/服务端 TLS 握手失败
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          which java && java -version
          # 清掉可能由别的 JDK 生成的 jack 配置，避免 SSL 错误
          # 注意：不要让 jack-admin 读取自定义 settings（缺 SETTING_VERSION 会 unbound variable）
          rm -rf ~/.jack-server ~/.jack-settings
          source build/envsetup.sh
          # 该设备树的 AndroidProducts.mk 里产品名是 omni_on7ltechn（源自 Omni/TWRP 树），
          # lunch 目标即 omni_on7ltechn-userdebug；breakfast 能自动匹配，失败则退回显式 lunch。
          breakfast ${{ inputs.device }} || lunch omni_${{ inputs.device }}-userdebug
          # 同步出的 .repo 目录（含全部 git 元数据）编译时不再需要，删掉可省十几 GB
          du -sh .repo 2>/dev/null || true
          rm -rf .repo
          df -h /mnt
          mka bacon -j${{ inputs.jobs }} 2>&1 | tee /mnt/build/build.log \
            | stdbuf -oL grep --line-buffered -E '^\[ *[0-9]+%|^FAILED|error:|ninja: build stopped'

      - name: 8. 查看产物
        if: always()
        working-directory: /mnt/build
        run: |
          df -h /mnt
          ls -lh out/target/product/${{ inputs.device }}/*.zip || true
          tail -n 80 build.log || true

      - name: 9. 上传 ROM zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-15.1-on7ltechn
          path: /mnt/build/out/target/product/on7ltechn/*.zip
          if-no-files-found: error

      - name: 10. 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /mnt/build/build.log
            /mnt/build/out/verbose.log.gz
          if-no-files-found: warn
