# 在 GitHub Actions 上编译 LineageOS 14.1 (Android 7.1.2) for Samsung Galaxy On7 国行 (on7ltechn)
#
# 设备树来源：
#   device/samsung/o7-common  ← 本仓库分支 cm-14.1-o7-common
#   device/samsung/on7ltechn  ← 本仓库分支 cm-14.1-on7ltechn
#   其余（common / vendor / kernel / audio）用 Galaxy-MSM8916 的 cm-14.1 分支

name: Build LineageOS 14.1 (on7ltechn)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Parallel jobs (-jx)'
        required: false
        default: '4'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 1. 清理磁盘并扩容
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /mnt/build
          build-mount-path-ownership: runner:runner
          root-reserve-mb: 10240
          temp-reserve-mb: 4096
          swap-size-mb: 16384
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=5 || sudo apt-get update -o Acquire::Retries=5
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libstdc++6 libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-8-jdk python3 unzip libtinfo5"
          for p in $PKGS; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 || echo "skip: $p"
          done
          for p in python2 python2.7 python2-minimal; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 && break
          done
          PY2="$(command -v python2.7 || command -v python2 || true)"
          if [ -z "$PY2" ]; then echo "FATAL: python2 not available"; exit 1; fi
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$PY2" /usr/local/bin/python
          echo "python -> $(readlink -f /usr/local/bin/python)"; python --version
          java -version || echo "NO JDK8"
          # 兜底：确认 swap 真的生效，否则 7GB runner 跑到 dex2oat 必被 OOM 杀
          if ! swapon --show | grep -q .; then
            echo "!!! swap 未启用，手动创建 8G"
            sudo fallocate -l 8G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          fi
          sudo sysctl -w vm.swappiness=60
          echo "=== 内存与 swap 状态 ==="
          free -h
          swapon --show
          df -h / /mnt/build

      - name: 3. 配置 git 和 repo
        run: |
          git config --global user.name  "GHA Builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 4. repo init (LineageOS 14.1) + 写 manifest
        working-directory: /mnt/build
        run: |
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=1 --no-clone-bundle
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/o7.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/samsung/msm8916-common" name="Galaxy-MSM8916/android_device_samsung_msm8916-common" revision="cm-14.1" groups="device" />
            <!-- qcom-common 提供 BOARD_USES_QCOM_HARDWARE=true，缺了会导致
                 qcom-audio 的 pathmap 指向不存在的目录，libaudiopolicymanager 没人生成 -->
            <project path="device/samsung/qcom-common" name="LineageOS/android_device_samsung_qcom-common" revision="cm-14.1" groups="device" />
            <!-- device/qcom/sepolicy 已在 LineageOS cm-14.1 默认清单里，重复添加会 duplicate path -->
            <project path="device/samsung/o7-common" name="LIyang-linux/lineage-on7ltechn" revision="cm-14.1-o7-common" groups="device" />
            <project path="device/samsung/on7ltechn" name="LIyang-linux/lineage-on7ltechn" revision="cm-14.1-on7ltechn" groups="device" />
            <project path="kernel/samsung/msm8916" name="Galaxy-MSM8916/android_kernel_samsung_msm8916" revision="cm-14.1" />
            <!-- vendor 直接用 15.1 分支：里面就是 5.1.1 原厂 blob，14.1 通用 -->
            <project path="vendor/samsung" name="Galaxy-MSM8916/proprietary_vendor_samsung" revision="lineage-15.1" />
            <project path="hardware/samsung" name="LineageOS/android_hardware_samsung" revision="cm-14.1" />
            <project path="device/qcom/common" name="LineageOS/android_device_qcom_common" revision="cm-14.1" />
            <project path="packages/resources/devicesettings" name="LineageOS/android_packages_resources_devicesettings" revision="cm-14.1" />
            <project path="external/sony/boringssl-compat" name="LineageOS/android_external_sony_boringssl-compat" revision="cm-14.1" />
          </manifest>
          XML
          # 去掉 manifest 里的缩进，repo 对前导空格敏感度不高，但保险
          sed -i 's/^ *//' .repo/local_manifests/o7.xml
          cat .repo/local_manifests/o7.xml

      - name: 5. repo sync
        working-directory: /mnt/build
        run: |
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          df -h /mnt

      - name: 6.1 内核 -fcommon（GCC>=10 默认 -fno-common，3.10 的 dtc 会重复定义）
        working-directory: /mnt/build
        run: |
          set -e
          K=kernel/samsung/msm8916/Makefile
          if ! grep -q '^HOSTCFLAGS.*-fcommon' "$K"; then
            sed -i 's/^HOSTCFLAGS *=/HOSTCFLAGS = -fcommon/' "$K"
          fi
          grep -n '^HOSTCFLAGS' "$K"

      - name: 6.2 补国行内核 defconfig（cm-14.1 分支没带）
        working-directory: /mnt/build
        run: |
          set -e
          DST=kernel/samsung/msm8916/arch/arm/configs/msm8916_sec_o7lte_chnopen_defconfig
          if [ ! -f "$DST" ]; then
            curl -fsSL -o "$DST" \
              https://raw.githubusercontent.com/Galaxy-MSM8916/android_kernel_samsung_msm8916/lineage-17.1/arch/arm/configs/msm8916_sec_o7lte_chnopen_defconfig
          fi
          grep -n "MACH_O7_CHN_OPEN\|SEC_O7_PROJECT" "$DST"
          # 这个文件只有 114 行，是 variant 片段，不能当主 defconfig 用
          # （直接当主 defconfig 会报 "You must specify VARIANT_DEFCONFIG !"）。
          # 主 defconfig 由 msm8916-common 的 board/kernel.mk 指定为 msm8916_sec_defconfig，
          # chnopen 通过 VARIANT_DEFCONFIG 合并；vendor/cm/build/tasks/kernel.mk 支持这个机制
          B=device/samsung/on7ltechn/BoardConfig.mk
          sed -i '/^TARGET_KERNEL_CONFIG.*o7lte_chnopen_defconfig/d' "$B"
          if ! grep -q '^TARGET_KERNEL_VARIANT_CONFIG' "$B"; then
            echo 'TARGET_KERNEL_VARIANT_CONFIG := msm8916_sec_o7lte_chnopen_defconfig' >> "$B"
          fi
          grep -n "TARGET_KERNEL" "$B"

      - name: 6.3 把 8.1 vendor mk 的产物路径改回 system（14.1 没有 /vendor 分区）
        working-directory: /mnt/build
        run: |
          set -e
          python3 - <<'PY'
          import io, os
          files = ["vendor/samsung/o7-common/o7-common-vendor.mk",
                   "vendor/samsung/on7ltechn/on7ltechn-vendor.mk"]
          for f in files:
              if not os.path.exists(f):
                  print("missing", f); continue
              out = []
              for line in io.open(f, encoding="utf-8").read().splitlines():
                  if ":" in line and "/proprietary/" in line:
                      src, dst = line.rsplit(":", 1)
                      d = dst.strip()
                      if d.startswith("vendor/"):
                          d = "system/" + d[len("vendor/"):]
                      # 8.0 的 passthrough HAL 命名，7.1 不认识
                      d = d.replace("camera.vendor.msm8916.so", "camera.msm8916.so")
                      d = d.replace("sensors.vendor.msm8916.so", "sensors.msm8916.so")
                      line = src + ":" + d
                  out.append(line)
              io.open(f, "w", encoding="utf-8").write("\n".join(out) + "\n")
              print("patched", f)
          PY
          grep -c ":system/" vendor/samsung/o7-common/o7-common-vendor.mk
          grep "sensors\|camera.msm8916" vendor/samsung/on7ltechn/on7ltechn-vendor.mk vendor/samsung/o7-common/o7-common-vendor.mk | head

      - name: 6.5 重新启用 Jack 并放行 JDK8 的旧 TLS
        working-directory: /mnt/build
        run: |
          set -e
          # cm-14.1 的 build/core/java.mk 里根本没有 javac+dx 的 dex 规则，
          # 只保留了 jack-java-to-dex。ANDROID_COMPILE_WITH_JACK=false 会让
          # 每个 Java 模块都引用不存在的 with-local/classes.dex，所以必须开 Jack。
          B=device/samsung/on7ltechn/BoardConfig.mk
          sed -i 's|^ANDROID_COMPILE_WITH_JACK.*|ANDROID_COMPILE_WITH_JACK := true|' "$B"
          grep -n "ANDROID_COMPILE_WITH_JACK" "$B"
          # Jack 客户端与服务端之间走 JDK 自带 TLS；JDK 8u3xx 起默认禁用旧协议，
          # 会报 "SSL error" 起不来，把禁用列表清空即可
          JS=/usr/lib/jvm/java-8-openjdk-amd64/jre/lib/security/java.security
          sudo sed -i 's|^jdk\.tls\.disabledAlgorithms=.*|jdk.tls.disabledAlgorithms=|' "$JS"
          sudo sed -i 's|^jdk\.certpath\.disabledAlgorithms=.*|jdk.certpath.disabledAlgorithms=|' "$JS"
          grep -n "^jdk\.tls\.disabledAlgorithms" "$JS"

      - name: 6.4 去掉 ANT+ 栈（本机没有 ANT 硬件）
        working-directory: /mnt/build
        run: |
          set -e
          grep -rln "BOARD_ANT_WIRELESS_DEVICE" device/samsung 2>/dev/null | while read f; do
            sed -i 's|^\(BOARD_ANT_WIRELESS_DEVICE.*\)$|# \1|' "$f"
            echo "disabled ant in $f"
          done
          grep -rln "AntHalService" device/samsung 2>/dev/null | while read f; do
            sed -i '/AntHalService/d' "$f"
            echo "removed AntHalService from $f"
          done
          grep -rn "ANT_WIRELESS\|AntHal" device/samsung 2>/dev/null | head || true

      - name: 6.6 修 cmsdk 资源依赖缺失（并行时 Manifest.java 还没生成）
        working-directory: /mnt/build
        run: |
          set -e
          # cm_platform_sdk 的 Android.mk 只给 org.cyanogenmod.platform 和
          # org.cyanogenmod.platform.sdk 声明了 R.stamp 依赖，
          # org.cyanogenmod.platform.internal 漏了。并行编译时 javac 抢在
          # 资源生成之前开跑，报 file not found: .../cyanogenmod/platform/Manifest.java
          A=vendor/cmsdk/Android.mk
          if ! grep -q "platform.internal_intermediates/classes-full-debug.jar" "$A"; then
            printf '\n# 补上 internal 模块对 cmsdk 资源生成步骤的依赖（上游 cm-14.1 漏写）\n%s\n' \
              '$(call intermediates-dir-for,JAVA_LIBRARIES,org.cyanogenmod.platform.internal,,COMMON)/classes-full-debug.jar: $(call intermediates-dir-for,APPS,org.cyanogenmod.platform-res,,COMMON)/src/R.stamp' >> "$A"
          fi
          tail -n 3 "$A"

      - name: 6.7 补 MAX_SOCKET_NAME_LENGTH（各仓库自带的 ril.h 都比 AOSP 老）
        working-directory: /mnt/build
        run: |
          set -e
          # AOSP 7.1 在 hardware/ril/include/telephony/ril.h:84 定义了
          # MAX_SOCKET_NAME_LENGTH，但三星和 CAF 的 fork 各自带了一份旧头文件，
          # 路径优先级更高，把 AOSP 那份盖掉了：
          #   hardware/samsung/ril/include/telephony/ril.h
          #   hardware/ril-caf/include/telephony/ril.h
          # 干脆把所有 ril.h 都扫一遍，缺就补上（值 6 与 AOSP 一致，重复定义无害）
          # 注意：不能按"文件里有没有这个宏"来筛，旧头文件里根本没有该宏，
          # 筛出来的是已经定义过的 AOSP 版本，等于什么都没改。
          # 正确做法：把所有 telephony/ril.h 都补一遍
          n=0
          while IFS= read -r H; do
            if grep -q "define MAX_SOCKET_NAME_LENGTH" "$H"; then
              echo "ok      $H"
            else
              printf '\n#ifndef MAX_SOCKET_NAME_LENGTH\n#define MAX_SOCKET_NAME_LENGTH 6\n#endif\n' >> "$H"
              echo "patched $H"
              n=$((n+1))
            fi
          done < <(find hardware device vendor -path "*/telephony/ril.h" 2>/dev/null)
          echo "patched headers: $n"

      - name: 6.8 修复 webview 预编译包的 LFS 指针
        working-directory: /mnt/build
        run: |
          set -e
          python3 - <<'PY'
          import json, os, re, urllib.request

          def post(url, payload):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="POST")
              req.add_header("Accept", "application/vnd.git-lfs+json")
              req.add_header("Content-Type", "application/vnd.git-lfs+json")
              return json.load(urllib.request.urlopen(req))

          # 设备只有 32 位，只需要 arm 这一份
          arch = "arm"
          d = f"external/chromium-webview/prebuilt/{arch}"
          p = os.path.join(d, "webview.apk")
          head = open(p, "rb").read(200) if os.path.exists(p) else b""
          if b"git-lfs.github.com/spec" not in head:
              print("not a lfs pointer, size=", os.path.getsize(p))
              raise SystemExit(0)
          txt = open(p, encoding="utf-8").read()
          oid = re.search(r"oid sha256:([0-9a-f]{64})", txt).group(1)
          size = int(re.search(r"size (\d+)", txt).group(1))
          url = ""
          cfg = os.path.join(d, ".lfsconfig")
          if os.path.exists(cfg):
              m = re.search(r'url\s*=\s*"?([^"\n]+)"?', open(cfg).read())
              if m:
                  url = m.group(1).strip()
          if not url:
              url = (f"https://review.lineageos.org/LineageOS/"
                     f"android_external_chromium-webview_prebuilt_{arch}.git/info/lfs")
          res = post(url.rstrip("/") + "/objects/batch",
                     {"operation": "download", "transfers": ["basic"],
                      "objects": [{"oid": oid, "size": size}]})
          href = res["objects"][0]["actions"]["download"]["href"]
          urllib.request.urlretrieve(href, p)
          print("fixed:", p, os.path.getsize(p))
          PY

      - name: 6.9 修正 system 分区大小与 OTA 断言（国行实测 1744MB）
        working-directory: /mnt/build
        run: |
          set -e
          # 实测 blockdev --getsize64 /dev/block/bootdevice/by-name/system = 1828716544
          # 设备树按国际版 2.03GB 生成镜像，国行写不进去（15.1 就是这样报 E1001 的）
          for f in $(grep -rl "^BOARD_SYSTEMIMAGE_PARTITION_SIZE" device/samsung 2>/dev/null); do
            sed -i 's|^BOARD_SYSTEMIMAGE_PARTITION_SIZE.*|BOARD_SYSTEMIMAGE_PARTITION_SIZE := 1828716544|' "$f"
            echo "patched $f"; grep -n "BOARD_SYSTEMIMAGE_PARTITION_SIZE" "$f"
          done
          # PBRP 自报 ro.product.device=o7prolte，断言不放行就 E3004
          B=device/samsung/on7ltechn/BoardConfig.mk
          sed -i '/^TARGET_OTA_ASSERT_DEVICE/d' "$B"
          echo 'TARGET_OTA_ASSERT_DEVICE := on7ltechn,o7prolte,o7lte,on7lte' >> "$B"
          grep -n "TARGET_OTA_ASSERT_DEVICE" "$B"

      - name: 6.10 双卡：ril-daemon2 服务（加载 libsec-ril-dsds.so）
        working-directory: /mnt/build
        run: |
          set -e
          # 原厂配置里双卡 RIL 服务叫 ril-daemon1（-l libsec-ril-dsds.so -c 2），
          # 但 init.class_main.sh 在 dsds/dsda 时 start 的是 ril-daemon2 —— 名字对不上，
          # 所以双卡进程根本起不来。这里把服务名与 start 统一改成 ril-daemon2。
          # socket rild2/rild-debug2 就定义在该服务里（libril SIM_COUNT=2 会连它）。
          F=device/samsung/msm8916-common/rootdir/etc/init.qcom.rc
          python3 - "$F" <<'EOF'
          import sys
          p=sys.argv[1]; t=open(p).read()
          # 1) 幂等：移除旧版误加到 ril-daemon 主服务的 rild2/rild-debug2 socket
          t=t.replace("""    socket rild-cas stream 660 casdrm mmb
              socket rild2 stream 660 root radio
              socket rild-debug2 stream 660 radio system
          ""","""    socket rild-cas stream 660 casdrm mmb
          """)
          # 2) 服务名 ril-daemon1 -> ril-daemon2（匹配 init.class_main.sh）
          n1 = t.count("service ril-daemon1 ")
          t = t.replace("service ril-daemon1 ", "service ril-daemon2 ")
          # 3) start 语句同步改名
          n2 = t.count("start ril-daemon1")
          t = t.replace("start ril-daemon1", "start ril-daemon2")
          open(p,"w").write(t)
          print("renamed service: %d, renamed start: %d" % (n1, n2))
          EOF
          echo "--- 结果 ---"
          grep -n "service ril-daemon\|start ril-daemon\|libsec-ril-dsds\|socket rild2" "$F" | head -15
          # 校验：必须存在 dsds 服务，且没有残留的 ril-daemon1
          grep -q "service ril-daemon2 /system/bin/rild -l /system/lib/libsec-ril-dsds.so -c 2" "$F" \
            || { echo "FAIL: ril-daemon2(dsds) 不存在"; exit 1; }
          ! grep -q "ril-daemon1" "$F" || { echo "FAIL: 仍有 ril-daemon1"; exit 1; }
          echo OK

      - name: 6.11 修 ril_class（7.1 无 SamsungQcomRIL），保持 dsds
        working-directory: /mnt/build
        run: |
          set -e
          # ro.telephony.ril_class=SamsungQcomRIL 是 8.1 的东西：7.1 的 telephony 里
          # 没有这个类，PhoneFactory.instantiateCustomRIL() 反射失败后会 while(true)
          # sleep，initSubscriptionController 永不执行。必须改。
          #
          # persist.radio.multisim.config 保持 dsds —— 双卡。
          # 之前改成 none 是为了绕开 SubscriptionInfoUpdater.isAllIccIdQueryDone()：
          #   sec-ril 对空卡槽只报 NOT_READY（不是 ABSENT），mIccId[1] 永远 null，
          #   siminfo 永不写入 → 设置里显示无 SIM。
          # 现在改为在第二步修 framework（容忍空卡槽），不再需要牺牲双卡。
          n=0
          while IFS= read -r f; do
            sed -i 's|ro\.telephony\.ril_class=SamsungQcomRIL|ro.telephony.ril_class=RIL|g' "$f"
            echo "== $f"
            grep -nE "ro\.telephony\.ril_class|persist\.radio\.multisim\.config" "$f" || true
            n=$((n+1))
          done < <(grep -rlE "SamsungQcomRIL" device vendor 2>/dev/null)
          echo "patched files: $n"
          # 确保没有把 dsds 改成 none 的残留
          if grep -rq 'persist.radio.multisim.config=none' device vendor 2>/dev/null; then
            echo "WARN: 仍有 multisim.config=none"
            grep -rn 'persist.radio.multisim.config=none' device vendor 2>/dev/null | head
          fi

      - name: 6.12 保持 init 的 dsds_properties（双卡）
        working-directory: /mnt/build
        run: |
          set -e
          # init_msm8916.cpp 在开机早期按 bootloader 上报的卡槽数(2)调用 dsds_properties()，
          # 直接 property_set 三个属性。所以只改 build.prop 没用：
          #   1) 这一步发生在 /data 挂载之前，persist.* 只存在内存里、不落盘
          #   2) ro.* 属性运行期无法修改
          # 双卡需要 dsds + simslotcount=2，这里确认它们没被改掉。
          F=device/samsung/msm8916-common/init/init_msm8916.cpp
          echo "--- init_msm8916.cpp 结果 ---"
          grep -n 'multisim\|simslotcount' "$F" || true
          # class_main.sh：dsds/dsda 分支会 start ril-daemon2，双卡需要保留
          S=device/samsung/msm8916-common/rootdir/etc/init.class_main.sh
          grep -n 'multisim.config' "$S" || true
          # 校验：必须是 dsds/none 之外的值
          if grep -q 'multisim.config", "none"' "$F"; then echo "FAIL: dsds 被改成 none"; exit 1; fi
          if grep -q 'simslotcount", "1"' "$F"; then echo "FAIL: simslotcount 被改成 1"; exit 1; fi
          echo OK

      - name: 6.13 保持双卡编译：SIM_COUNT=2
        working-directory: /mnt/build
        run: |
          set -e
          # SIM_COUNT 是 libril/rild 的编译期开关：=2 时加 -DANDROID_SIM_COUNT_2，
          # rild 会去 connect "rild2"（6.10 已加该 socket）。
          # 双卡需要保持 2。
          F=device/samsung/on7ltechn/BoardConfig.mk
          echo "--- BoardConfig 结果 ---"
          grep -n "SIM_COUNT\|RIL_FIX_SMS" "$F" || true
          if grep -q '^SIM_COUNT := 1' "$F"; then echo "FAIL: SIM_COUNT 为 1"; exit 1; fi
          echo OK

      - name: 6.14 双卡第二步：修 framework，容忍空卡槽（NOT_READY）
        working-directory: /mnt/build
        run: |
          set -e
          # 根因：三星 sec-ril 对空卡槽上报 NOT_READY（不是 ABSENT）。
          # SubscriptionInfoUpdater 的 ACTION_SIM_STATE_CHANGED 只处理
          # ABSENT/UNKNOWN/IO_ERROR/RESTRICTED，NOT_READY 落入 "Ignoring simStatus"，
          # 于是 mIccId[slot] 永远为 null → isAllIccIdQueryDone() 永远 false →
          # updateSubscriptionInfoByIccId() 永不执行 → siminfo 不写入 → 设置里显示无 SIM。
          #
          # 改法：把 NOT_READY 视同 ABSENT（走 handleSimAbsentOrError，写 ICCID_STRING_FOR_NO_SIM）。
          # 已本地用状态机模拟验证：单卡(NOT_READY)/双卡/无卡/真 ABSENT 四种场景行为正确。
          F=frameworks/opt/telephony/src/java/com/android/internal/telephony/SubscriptionInfoUpdater.java
          test -f "$F" || { echo "FAIL: 文件不存在 $F"; exit 1; }
          python3 - "$F" <<'PYEOF'
          import sys, re
          p = sys.argv[1]
          t = open(p, encoding='utf-8', newline='').read()
          print('文件行数: %d, CRLF 数: %d' % (t.count('\n'), t.count('\r\n')))
          # 容忍 CRLF / 缩进差异（} 的缩进比 sendMessage 少，不能要求一致）
          pat = re.compile(
              r"if \(IccCardConstants\.INTENT_VALUE_ICC_ABSENT\.equals\(simStatus\)\) \{"
              r"(?P<ws>[ \t]*\r?\n[ \t]*)"
              r"sendMessage\(obtainMessage\(EVENT_SIM_ABSENT, slotId, -1\)\);"
              r"[ \t]*\r?\n[ \t]*\} else if")
          m = pat.search(t)
          if not m:
              print('FAIL: 未匹配到 ABSENT 分支')
              i = t.find('INTENT_VALUE_ICC_ABSENT.equals(simStatus)')
              if i < 0:
                  print('连 ABSENT 分支都不存在')
              else:
                  print('实际内容片段:')
                  print(repr(t[max(0, i - 120):i + 400]))
              sys.exit(1)
          ws = m.group('ws')
          new = ("if (IccCardConstants.INTENT_VALUE_ICC_ABSENT.equals(simStatus)"
                 + ws.replace('\r\n', '\n') + "|| IccCardConstants.INTENT_VALUE_ICC_NOT_READY"
                 ".equals(simStatus)) {" + ws +
                 "// Samsung sec-ril reports NOT_READY (not ABSENT) for an empty slot." + ws +
                 "// Without this the slot's mIccId stays null forever, so" + ws +
                 "// isAllIccIdQueryDone() never returns true and siminfo is never" + ws +
                 "// written (Settings shows no SIM). Treat NOT_READY as no-SIM." + ws +
                 "sendMessage(obtainMessage(EVENT_SIM_ABSENT, slotId, -1));" + ws +
                 "} else if")
          # 保持原文件的行尾风格
          if '\r\n' in t:
              new = new.replace('\n', '\r\n')
          out = t[:m.start()] + new + t[m.end():]
          open(p, 'w', encoding='utf-8', newline='').write(out)
          print('patched SubscriptionInfoUpdater.java')
          PYEOF
          echo "--- 校验 ---"
          grep -n "INTENT_VALUE_ICC_NOT_READY.equals(simStatus)" "$F" | head -3
          if ! grep -q "INTENT_VALUE_ICC_NOT_READY.equals(simStatus)" "$F"; then
            echo "FAIL: 补丁未生效"; exit 1
          fi
          echo OK

      - name: 6.15 注入 Android 9 IMS 包（android.telephony.ims.*，7.1 缺失）
        working-directory: /mnt/build
        run: |
          set -e
          # SM8250 的 imsservice.apk 需要 Android 9 引入的 android.telephony.ims.*；
          # LineageOS cm-14.1（7.1）只有 com.android.ims.internal.*（旧接口）。
          # 把 AOSP 9.0 的整套 IMS 包放进 telephony/java（编译进 telephony-common.jar）。
          S="$GITHUB_WORKSPACE/ims-compat/src"
          test -d "$S"
          # android.telephony.ims.* -> frameworks/base/telephony/java/
          mkdir -p frameworks/base/telephony/java/android/telephony/ims
          cp -r "$S/android/telephony/ims/." frameworks/base/telephony/java/android/telephony/ims/
          # com.android.ims.* -> frameworks/base/telephony/java/
          mkdir -p frameworks/base/telephony/java/com/android/ims/internal
          cp -r "$S/com/android/ims/." frameworks/base/telephony/java/com/android/ims/
          # android.annotation.CallbackExecutor -> frameworks/base/core/java/
          mkdir -p frameworks/base/core/java/android/annotation
          cp -r "$S/android/annotation/." frameworks/base/core/java/android/annotation/
          echo "注入完成:"
          echo "  telephony/ims: $(find frameworks/base/telephony/java/android/telephony/ims -type f | wc -l) 文件"
          echo "  com/android/ims: $(find frameworks/base/telephony/java/com/android/ims -type f | wc -l) 文件"
          ls frameworks/base/core/java/android/annotation/CallbackExecutor.java

      - name: 7. 编译
        timeout-minutes: 240
        working-directory: /mnt/build
        run: |
          # 不用 set -e，每一步自己判错，保证日志一定落盘
          set +e
          export LC_ALL=C
          # runner 默认 JAVA_HOME 是 JDK 11，14.1 必须用 JDK 8（要有 lib/tools.jar）
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          # Jack 服务端默认堆太小，16G 机器给到 6G
          export JACK_SERVER_VM_ARGUMENTS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4g"
          java -version
          source build/envsetup.sh
          # 14.1 的 breakfast 会先跑 vendor/cm/tools/roomservice.py，失败时静默退出；
          # 直接 lunch 到明确的产品名，绕开 roomservice
          lunch lineage_on7ltechn-userdebug
          lunch_rc=$?
          echo "lunch rc=$lunch_rc TARGET_PRODUCT=${TARGET_PRODUCT:-none} TARGET_DEVICE=${TARGET_DEVICE:-none}"
          if [ $lunch_rc -ne 0 ] || [ -z "${TARGET_PRODUCT:-}" ]; then
            echo "=== LUNCH FAILED ==="; exit 1
          fi
          # 双保险：先把 cmsdk 资源模块单独编出来，避免并行竞态
          m -j2 org.cyanogenmod.platform-res 2>&1 | tail -n 5
          # 行缓冲 + 放宽过滤：把 Install/Package/dex2oat/Image 这些关键阶段打出来，
          # 否则永远只看到最后一条 [89%] Strip 行，无法判断卡在哪
          # mka 是 shell 函数，不能被 stdbuf 包装（会 exit 127）。
          # 用 script 分配 pty，既能强制行缓冲拿到完整日志，又保留 mka 的语义。
          set -o pipefail
          # script -c 会新起一个 sh，里面没有 mka 函数，必须重新 source + lunch
          script -qfec "bash -c 'source build/envsetup.sh >/dev/null && lunch lineage_on7ltechn-userdebug >/dev/null && mka bacon -j3'" build.log &
          SPID=$!
          tail -n +1 -f build.log --pid=$SPID 2>/dev/null | grep --line-buffered -E '^\[ *[0-9]+%|^Install|^Package|^FAILED|error:|ninja: build stopped|^PLATFORM_VERSION|system\.img|boot\.img' &
          GPID=$!
          wait $SPID; rc=$?
          sleep 2; kill $GPID 2>/dev/null || true
          echo "=== mka rc=$rc ==="
          echo "--- 未过滤的最后 30 行（真正卡住的位置） ---"
          tail -n 30 build.log
          echo "--- 现场快照 ---"
          free -h || true
          df -h / /mnt/build || true
          (sudo dmesg | tail -25) 2>/dev/null || true
          (ps -eo pcpu,pmem,comm --sort=-pcpu | head -12) 2>/dev/null || true
          exit $rc

      - name: 8. 列出产物
        if: success()
        working-directory: /mnt/build
        run: |
          ls -lh out/target/product/on7ltechn/*.zip
          cat out/target/product/on7ltechn/system/build.prop | grep -E "ro.build.version|ro.product" | head

      - name: 9. 上传 ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-14.1-on7ltechn
          path: |
            /mnt/build/out/target/product/on7ltechn/lineage-14.1-*.zip
            /mnt/build/out/target/product/on7ltechn/recovery.img
          if-no-files-found: warn

      - name: 10. 失败时上传日志
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-14.1
          path: /mnt/build/build.log
          if-no-files-found: warn
